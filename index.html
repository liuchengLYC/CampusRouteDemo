<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>校園導覽地圖</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="map"></div>

  <aside class="panel">
    <h1>校園路線導覽</h1>

    <div class="control-group">
      <label for="routeSelect">選擇路線</label>
      <select id="routeSelect"></select>
    </div>

    <div class="button-group">
      <button id="loadRouteBtn">載入路線</button>
      <button id="showRouteBtn">顯示路線</button>
    </div>

    <div class="button-group">
      <button id="prevStepBtn" disabled>上一步</button>
      <button id="nextStepBtn" disabled>下一步</button>
    </div>

    <div class="info-card" id="routeInfo">
      尚未載入路線
    </div>

    <div class="info-card" id="currentStepCard">
      目前沒有導航步驟
    </div>

    <div class="info-card">
      <h2>全部導航步驟</h2>
      <ol id="stepsList"></ol>
    </div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./app.js"></script>
</body>
</html>
